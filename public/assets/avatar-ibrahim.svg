<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A3D66"/>
      <stop offset="100%" stop-color="#0F2847"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8D5524"/>
      <stop offset="100%" stop-color="#6B3F1D"/>
    </linearGradient>
    <linearGradient id="hair2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#bg2)"/>
  <!-- Neck -->
  <rect x="47" y="78" width="26" height="16" rx="4" fill="url(#skin2)"/>
  <!-- Suit/shirt with tie -->
  <rect x="26" y="92" width="68" height="32" rx="4" fill="#0F2847"/>
  <rect x="38" y="92" width="44" height="32" rx="2" fill="#1A3D66"/>
  <!-- Shirt collar -->
  <polygon points="50,92 60,102 70,92" fill="#FFFFFF" opacity="0.9"/>
  <!-- Tie -->
  <polygon points="58,96 62,96 61,112 59,112" fill="#D4A82A"/>
  <!-- Face -->
  <ellipse cx="60" cy="52" rx="27" ry="28" fill="url(#skin2)"/>
  <!-- Hair - short professional cut -->
  <ellipse cx="60" cy="34" rx="28" ry="18" fill="url(#hair2)"/>
  <rect x="32" y="30" width="56" height="14" rx="8" fill="url(#hair2)"/>
  <!-- Eyes -->
  <ellipse cx="49" cy="52" rx="3.5" ry="4" fill="#1A1A1A"/>
  <ellipse cx="71" cy="52" rx="3.5" ry="4" fill="#1A1A1A"/>
  <circle cx="50" cy="51" r="1.2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="72" cy="51" r="1.2" fill="#FFFFFF" opacity="0.7"/>
  <!-- Eyebrows -->
  <path d="M43 46 Q49 43 55 46" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M65 46 Q71 43 77 46" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M56 54 Q60 61 64 54" stroke="#5A3015" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M50 63 Q60 69 70 63" stroke="#5A3015" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="32" cy="52" rx="4" ry="6" fill="url(#skin2)"/>
  <ellipse cx="88" cy="52" rx="4" ry="6" fill="url(#skin2)"/>
</svg>
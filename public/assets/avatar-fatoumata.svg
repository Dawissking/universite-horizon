<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A3D66"/>
      <stop offset="100%" stop-color="#0F2847"/>
    </linearGradient>
    <linearGradient id="skin1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C68642"/>
      <stop offset="100%" stop-color="#A0673C"/>
    </linearGradient>
    <linearGradient id="hair1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#bg1)"/>
  <!-- Neck -->
  <rect x="48" y="78" width="24" height="16" rx="4" fill="url(#skin1)"/>
  <!-- Shoulders/shirt -->
  <ellipse cx="60" cy="108" rx="42" ry="28" fill="#D4A82A"/>
  <rect x="30" y="94" width="60" height="30" rx="4" fill="#D4A82A"/>
  <!-- Face -->
  <ellipse cx="60" cy="52" rx="26" ry="28" fill="url(#skin1)"/>
  <!-- Hair - natural afro style -->
  <ellipse cx="60" cy="36" rx="30" ry="22" fill="url(#hair1)"/>
  <ellipse cx="60" cy="42" rx="28" ry="16" fill="url(#hair1)"/>
  <!-- Eyes -->
  <ellipse cx="50" cy="52" rx="3.5" ry="4" fill="#1A1A1A"/>
  <ellipse cx="70" cy="52" rx="3.5" ry="4" fill="#1A1A1A"/>
  <circle cx="51" cy="51" r="1.2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="71" cy="51" r="1.2" fill="#FFFFFF" opacity="0.7"/>
  <!-- Eyebrows -->
  <path d="M44 46 Q50 43 56 46" stroke="#1A1A1A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M64 46 Q70 43 76 46" stroke="#1A1A1A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M57 54 Q60 60 63 54" stroke="#8B5E3C" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M50 62 Q60 70 70 62" stroke="#8B5E3C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Earrings -->
  <circle cx="33" cy="54" r="2.5" fill="#F0C850"/>
  <circle cx="87" cy="54" r="2.5" fill="#F0C850"/>
</svg>